<title>Latin Church Music</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2420;--muted:#7a6f66;--card:#fff;--line:#e4dccf;--accent:#8a2f2f;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--fg:#ece5dc;--muted:#a39a90;--card:#26221f;--line:#3a342f;--accent:#e08a7a}}

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.55}
main{max-width:860px;margin:0 auto;padding:10px 16px 0;height:100%;display:flex;flex-direction:column}
#text{flex:1;min-height:0;overflow-y:auto;padding-bottom:24px;-webkit-overflow-scrolling:touch}
h1{font-size:1.25rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:.8rem;margin:0 0 8px}
.tabs{flex:none;display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.tab{font:600 .95rem system-ui,sans-serif;padding:10px 14px;border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;cursor:pointer}
.tab.on{background:var(--accent);color:var(--bg)}
.player{flex:none;aspect-ratio:16/9;width:min(100%,calc(38vh * 16 / 9));margin:0 auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
.player iframe{width:100%;height:100%;border:0}
.links{flex:none;margin:6px 0 12px;display:flex;gap:10px}
.btn{flex:1;text-align:center;background:var(--accent);color:var(--bg);text-decoration:none;font-family:system-ui,sans-serif;font-weight:600;font-size:1.05rem;padding:14px 12px;border-radius:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.num{grid-column:1/-1;color:var(--accent);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 -6px}
.la{font-style:italic;font-size:1.05rem}
.en{color:var(--muted)}
.la div,.en div{margin:2px 0}
@media (max-width:560px){.st{grid-template-columns:1fr;gap:8px}}
.hint{flex:none;margin:0 0 8px;font:.8rem system-ui,sans-serif;color:var(--muted);text-align:center}
.w{border-bottom:1px dotted var(--accent);cursor:pointer}
.w.on{background:color-mix(in srgb,var(--accent) 22%,transparent)}
#panel{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:2px solid var(--accent);box-shadow:0 -4px 16px rgba(0,0,0,.18);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px))}
#panel .in{max-width:860px;margin:0 auto;position:relative;padding-right:36px}
#panel h2{margin:0;font-size:1.3rem;font-style:italic}
#panel .lem{color:var(--accent);font:600 .9rem system-ui,sans-serif}
#panel p{margin:6px 0;font-size:.95rem}
#panel .et{color:var(--muted);font-size:.9rem}
#px{position:absolute;right:0;top:-4px;border:0;background:none;color:var(--muted);font-size:1.8rem;line-height:1;cursor:pointer}
.ask{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.ask a{font:600 .85rem system-ui,sans-serif;color:var(--bg);background:var(--accent);text-decoration:none;padding:9px 14px;border-radius:999px}
body.pn #text{padding-bottom:320px}
</style>
</head>

GT.trim().split('\n').forEach(r=>{const p=r.split('|');if(p[1][0]==='='){const b=G[p[1].slice(1)];G[p[0]]={l:b.l,m:b.m,g:p[2]}}else G[p[0]]={l:p[1],m:p[2],g:p[3]}});
const PJ=SONGS[1].gloss;
SONGS[0].gloss=Object.assign({},G,PJ,{iesu:PJ.jesu});
SONGS[2].gloss=Object.assign({},G,{domine:PJ.domine});
const $=id=>document.getElementById(id);
function latin(str,gloss,en,title){
 const f=document.createDocumentFragment();
 str.split('|').forEach(line=>{
  const d=document.createElement('div');
  line.split(/(\s+)/).forEach(tok=>{
   const k=tok.toLowerCase().replace(/[^a-z]/g,'');
   if(gloss&&gloss[k]){
    const w=document.createElement('span');w.className='w';w.tabIndex=0;w.setAttribute('role','button');w.textContent=tok;
    w.onclick=e=>{e.stopPropagation();openP(w,tok.replace(/[^A-Za-z]/g,''),gloss[k],line,en,title)};
    w.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();w.click()}};
    d.appendChild(w);
   }else d.appendChild(document.createTextNode(tok));
  });
  f.appendChild(d)});
 return f}
function openP(w,word,g,line,en,title){
 document.querySelectorAll('.w.on').forEach(x=>x.classList.remove('on'));
 w.classList.add('on');
 $('pw').textContent=word;$('pl').textContent=g.l+'  \u00b7  '+g.m;$('pg').textContent=g.g;$('pe').textContent=g.e||'';
 const q='Please parse this Latin line from "'+title+'" (church music), word by word, giving dictionary form, grammar, meaning and any interesting etymology. Line: '+line+' English translation of the verse: '+en+' I tapped the word: '+word;
 const pa=$('pa');pa.textContent='';
 [['Ask Claude about this line','https://claude.ai/new?q='],['Ask ChatGPT','https://chatgpt.com/?q=']].forEach(([t,u])=>{const a=document.createElement('a');a.href=u+encodeURIComponent(q);a.target='_blank';a.rel='noopener';a.textContent=t;pa.appendChild(a)});
 $('panel').style.display='block';document.body.classList.add('pn');
}
function closeP(){
 document.querySelectorAll('.w.on').forEach(x=>x.classList.remove('on'));
 $('panel').style.display='none';document.body.classList.remove('pn');
}
document.addEventListener('click',e=>{if(!e.target.closest('#panel'))closeP()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeP()});
$('px').onclick=closeP;
function lines(s,sep){const f=document.createDocumentFragment();s.split(sep).forEach(t=>{const d=document.createElement('div');d.textContent=t.trim();f.appendChild(d)});return f}
function show(i){
 const s=SONGS[i];
 document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',j===i));
 $('text').scrollTop=0;closeP();$('hint').style.display=s.gloss?'':'none';
 $('title').textContent=s.title;$('sub').textContent=s.sub;
 const p=$('player');p.textContent='';
 p.style.display='none';
 const l=$('links');l.textContent='';
 if(s.ytUrl){const a=document.createElement('a');a.href=s.ytUrl;a.target='_blank';a.rel='noopener';a.className='btn';a.textContent='▶ Play on YouTube';l.appendChild(a)}
 if(s.spotify){const a=document.createElement('a');a.href=s.spotify;a.target='_blank';a.rel='noopener';a.className='btn';a.textContent='▶ Play on Spotify';l.appendChild(a)}
 const t=$('text');t.textContent='';
 s.stanzas.forEach((st,n)=>{
  const c=document.createElement('section');c.className='st';
  const h=document.createElement('p');h.className='num';h.textContent='Verse '+(n+1);
  const la=document.createElement('div');la.className='la';la.appendChild(latin(st[0],s.gloss,st[1],s.title));
  const en=document.createElement('div');en.className='en';en.appendChild(lines(st[1],' / '));
  c.append(h,la,en);t.appendChild(c);
 });
}
const pick=$('pick');
SONGS.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='tab';b.textContent=s.title;b.onclick=()=>show(i);pick.appendChild(b)});
if(SONGS.length<2)pick.style.display='none';
show(0);
